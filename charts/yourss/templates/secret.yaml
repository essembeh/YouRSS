{{- if and .Values.yourss.users (not .Values.yourss.pages) }}
{{- fail "yourss.users needs yourss.pages: a user aggregates pages" }}
{{- end }}
{{- if .Values.yourss.pages }}
# The application reads this file on every request: an update needs no restart
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yourss.fullname" . }}-users
  labels:
    {{- include "yourss.labels" . | nindent 4 }}
stringData:
  users.yaml: |
    pages:
      {{- toYaml .Values.yourss.pages | nindent 6 }}
    users:
      {{- toYaml (.Values.yourss.users | default list) | nindent 6 }}
{{- end }}
