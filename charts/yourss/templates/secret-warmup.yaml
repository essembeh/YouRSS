{{- if and .Values.warmup.enabled .Values.yourss.cacheEnabled .Values.yourss.users }}
# One curl config file per page the warmup job loads (one per folder of a user in folders): the clear passwords
# never reach a command line
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yourss.fullname" . }}-warmup
  labels:
    {{- include "yourss.labels" . | nindent 4 }}
    app.kubernetes.io/component: warmup
stringData:
  {{- $base := printf "http://%s:%v" (include "yourss.fullname" .) .Values.service.port }}
  {{- $users := dict }}
  {{- range .Values.yourss.users }}{{ $_ := set $users .name . }}{{ end }}
  {{- range .Values.warmup.users }}
  {{- $user := get $users . }}
  {{- if not $user }}
  {{- fail (printf "warmup: the user %q is not in yourss.users" .) }}
  {{- else if not (include "yourss.clearPassword" $user) }}
  {{- fail (printf "warmup: the user %q has an argon2 password, its page cannot be loaded" .) }}
  {{- end }}
  {{- end }}
  {{- range .Values.yourss.users }}
  {{- if include "yourss.warmable" (list $ .) }}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$" .name) }}
  {{- fail (printf "warmup: the user name %q cannot be a Secret key" .name) }}
  {{- end }}
  {{- $user := . }}
  {{- if .folders }}
  {{- range .folders }}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$" .name) }}
  {{- fail (printf "warmup: the folder name %q of %q is invalid" .name $user.name) }}
  {{- end }}
  {{ $user.name }}.{{ .name }}.conf: |
    url = {{ printf "%s/u/%s?f=%s" $base $user.name .name | quote }}
    {{- if $user.password }}
    user = {{ printf "%s:%s" $user.name $user.password.value | quote }}
    {{- end }}
  {{- end }}
  {{- else }}
  {{ .name }}.conf: |
    url = {{ printf "%s/u/%s" $base .name | quote }}
    {{- if .password }}
    user = {{ printf "%s:%s" .name .password.value | quote }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
