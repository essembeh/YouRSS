{{- if and .Values.warmup.enabled .Values.yourss.cacheEnabled .Values.yourss.users }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "yourss.fullname" . }}-warmup
  labels:
    {{- include "yourss.labels" . | nindent 4 }}
    app.kubernetes.io/component: warmup
spec:
  schedule: {{ .Values.warmup.schedule | quote }}
  timeZone: {{ .Values.yourss.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            # Not the selector labels: the Service must not pick this pod
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: warmup
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: warmup
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.warmup.image.repository }}:{{ .Values.warmup.image.tag }}"
              imagePullPolicy: {{ .Values.warmup.image.pullPolicy }}
              command:
                - /bin/sh
                - -euc
                # Every page is tried, the job fails if any of them did
                - |
                  failed=0
                  for conf in /etc/yourss/warmup/*.conf; do
                    [ -e "$conf" ] || continue
                    curl --silent --show-error --fail --output /dev/null \
                      --max-time {{ .Values.warmup.timeout }} \
                      --write-out "%{url} %{http_code} %{time_total}s\n" \
                      --config "$conf" || failed=1
                  done
                  exit $failed
              resources:
                {{- toYaml .Values.warmup.resources | nindent 16 }}
              volumeMounts:
                - name: warmup
                  mountPath: /etc/yourss/warmup
                  readOnly: true
          volumes:
            - name: warmup
              secret:
                secretName: {{ include "yourss.fullname" . }}-warmup
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
