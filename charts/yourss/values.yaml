# Default values for yourss.

replicaCount: 1

yourss:
  image:
    repository: ghcr.io/essembeh/yourss
    # tag: main
    pullPolicy: IfNotPresent
  timezone: Europe/Paris
  logLevel: INFO

  # --- Application settings: each value maps to one YOURSS_* environment variable

  # YOURSS_CUSTOM_PAGES_ENABLED: let visitors build their own multi channel page. When false, only
  # the user pages below remain
  customPagesEnabled: true
  # YOURSS_MAX_PAGE_ITEMS: how many channels and playlists the address of a custom page may hold
  maxPageItems: 12
  # YOURSS_API_DOCS_ENABLED: serve the generated API documentation (/docs, /redoc, /openapi.json)
  apiDocsEnabled: false
  # YOURSS_CLEAN_TITLES: capitalize the titles to tame UPPERCASE ones
  cleanTitles: false
  # YOURSS_CACHE_ENABLED: keep the RSS feeds and the channel metadata (name, avatar) on disk. A
  # feed younger than cacheRssTtl is served without asking Youtube; when the fetch fails (Youtube's
  # daily transient 404 windows), a feed younger than cacheRssFallbackTtl is served instead of the
  # error. When false, nothing is cached: every page load scrapes a page per channel
  cacheEnabled: true
  # YOURSS_CACHE_FOLDER: where the cache lives; empty means a temporary folder under /tmp (an
  # emptyDir), lost with the pod. The pod does not start if it cannot write there
  cacheFolder: ""
  # YOURSS_CACHE_RSS_TTL: how long a cached feed is served without asking Youtube (ISO-8601
  # duration or seconds)
  cacheRssTtl: PT30M
  # YOURSS_CACHE_RSS_FALLBACK_TTL: how long a cached feed may replace a failed fetch, must be at
  # least cacheRssTtl (ISO-8601 duration or seconds)
  cacheRssFallbackTtl: PT48H
  # YOURSS_CACHE_METADATA_TTL: how long the name and avatar of a channel are served without
  # scraping its page (ISO-8601 duration or seconds)
  cacheMetadataTtl: PT24H
  # YOURSS_USERS_FILE: user pages, stored in a Secret since they may hold passwords
  users:
    []
    # - name: alice
    #   # password is optional
    #   password:
    #     # supported methods are
    #     #  argon2: example here https://gchq.github.io/CyberChef/#recipe=Argon2(%7B'option':'UTF8','string':'yourss%20secret%20salt'%7D,3,4096,1,32,'Argon2i','Encoded%20hash')&input=TXkgc2VjdXJlIHBhc3N3b3Jk
    #     #  clear: password are store in plain text
    #     method: argon2
    #     value: "$argon2i$v=19$m=4096,t=3,p=1$c29tZXNhbHQ$y+awVl4ev1h6eG8IbOrPAAjANRIbraM51FL50Pcf/B8"
    #   channels:
    #     # channels can be
    #     #  a channel_id (starting with UC) like UCVooVnzQxPSTXTMzSi1s6uw
    #     #  a user (starting with @) like @jonnygiger
    #     - "@jonnygiger"
    #     - "@berrics"
    # - name: demo
    #   channels:
    #     - "@jonnygiger"
    #     - "@berrics"

  # Additional environment variables for the container
  extraEnv: []
  # - name: HTTPS_PROXY
  #   value: http://proxy:3128

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # The application never talks to the Kubernetes API
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as an unprivileged user and only writes to /tmp (an emptyDir)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # requests.cpu is required for autoscaling.enabled to work: the HPA computes
  # CPU utilization as a percentage of the request. Without it the HPA cannot
  # scale. YouRSS is I/O-bound (mostly waiting on Youtube), so requests are low.
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    # no cpu limit on purpose (avoid throttling a bursty I/O-bound app)
    memory: 512Mi

# The pods share nothing: each one has its own cache
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Keep the cache warm: a CronJob loads every user page on a schedule, so that a visitor finds the
# feeds and the channel metadata already on disk. A page whose user has an argon2 password cannot
# be loaded by the job and is skipped; a clear password is sent as the visitor would
warmup:
  enabled: false
  # Cron expression, in yourss.timezone. A run refreshes the feeds older than yourss.cacheRssTtl
  schedule: "0 * * * *"
  # Names of the users to warm up, every user when empty
  users: []
  # Seconds given to each page, cold pages scrape one Youtube page per channel
  timeout: 120
  image:
    repository: curlimages/curl
    tag: 8.23.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
