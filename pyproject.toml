[project]
name = "yourss"
version = "0.17.1"
description = "Simple Youtube browser based on RSS feeds"
readme = "README.md"
authors = [{ name = "Sébastien MB", email = "seb@essembeh.org" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "arrow>=1.4.0",
    "fastapi[standard]>=0.136.3",
    "glom>=25.12.0",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pydantic-xml>=2.21.0",
    "pydantic-yaml>=1.6.0",
    "rapid-api-client>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/essembeh/YouRSS"
Repository = "https://github.com/essembeh/YouRSS"
Issues = "https://github.com/essembeh/YouRSS/issues"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "mypy>=1.19",
    "pip-audit>=2.10.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.16",
]

[build-system]
# The range must contain the uv version in use (UV_VERSION of the Dockerfile, CI image):
# uv only builds with its embedded backend in that case.
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120                    # root, not [lint]: applies to the formatter AND to E501

[tool.ruff.lint]
# Explicit ruleset, independent from ruff's default one.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports/variables, undefined names)
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (follows requires-python)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async (blocking call in a coroutine)
    "S",     # flake8-bandit (shell=True, yaml.load, md5, hardcoded secrets, eval, …)
]
# ANN is left out on purpose: redundant with mypy strict.

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest works, not a production assert.
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be called in argument defaults: not a B008.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File", "fastapi.Security",
]

[tool.mypy]
strict = true                        # strict bundle: do not redeclare its components
warn_unreachable = true              # outside the strict bundle, but useful
warn_redundant_casts = true
# Pydantic v2: native mypy support, no plugin needed.

[tool.pytest.ini_options]
testpaths = ["tests"]
env_files = [".env"]

[tool.coverage.run]
# Without it the measure covers the whole virtualenv and TOTAL says nothing about the package.
source = ["yourss"]
